[package]
name = "ants"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "2" # Important! wgpu/Bevy needs this!

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[dependencies]
bevy = { version = "0.12", features = ["dynamic_linking"] }
#bevy = "0.11.0"
#wgpu = "0.16"
wgpu = { version = "0.16", features = ["webgl"] }  # If you need WebGL support
rand = "0.8.5"
bevy_pancam = "0.10"
bevy_egui = "0.23"
kd-tree = "0.5.1"

[features]
web-sys-unstable-apis = []

#[dependencies.web-sys]
#version = "0.3.77"
#features = ["GpuImageCopyBuffer"]  # Case-sensitive feature name
#features = ["gpu_buffer_copy_view"]
